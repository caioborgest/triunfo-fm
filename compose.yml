services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: triunfo_fm
      POSTGRES_USER: triunfo
      POSTGRES_PASSWORD: triunfo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triunfo -d triunfo_fm"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: triunfo
      MINIO_ROOT_PASSWORD: triunfo_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
